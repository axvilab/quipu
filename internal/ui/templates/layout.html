<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Quipu</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#1C1917">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <nav class="side">
    <a class="brand" href="/"><img src="/static/icon.svg" alt="" width="28" height="28"> Quipu</a>
    <a href="/" {{if eq .Nav "overview"}}class="on" aria-current="page"{{end}}>Projects</a>
    <a href="/cache" {{if eq .Nav "cache"}}class="on" aria-current="page"{{end}}>Cache</a>
    <a href="/advice" {{if eq .Nav "advice"}}class="on" aria-current="page"{{end}}>Advisor</a>
    <a href="/profiles" {{if eq .Nav "profiles"}}class="on" aria-current="page"{{end}}>Profiles</a>
    <div class="grow"></div>
    <a class="profile-label" href="/profiles">Profiles</a>
    {{range .Profiles}}
    <div class="profile{{if .Current}} current{{end}}" title="{{if .LoggedIn}}{{.Account}}{{else}}not logged in{{end}}">
      <span><strong>{{.Name}}</strong>{{with .Account}}<br><span class="small">{{.}}</span>{{end}}</span>
      <span class="dot{{if .LoggedIn}} on{{end}}" aria-label="{{if .LoggedIn}}logged in{{else}}not logged in{{end}}"></span>
    </div>
    {{end}}
  </nav>
  <main>
    {{with .Msg}}<div class="flash" role="status">{{.}}</div>{{end}}
    {{template "content" .}}
  </main>
</div>
</body>
</html>
