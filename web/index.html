<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171A23" />
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <title>Quipu</title>
    <script>
      // Apply the theme before the first paint (see src/lib/theme.svelte.ts).
      try {
        const t = localStorage.getItem("quipu.theme");
        const light = t === "light" || (t !== "dark" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
