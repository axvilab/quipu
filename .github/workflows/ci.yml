name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web interface
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Type-check the web interface
        working-directory: web
        run: npm run check
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: GTK and WebKit headers for the window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build the window (quipu-app)
        run: |
          tags=desktop,production
          if [ "$RUNNER_OS" = Linux ]; then tags=$tags,webkit2_41; fi
          go build -tags "$tags" -o /tmp/quipu-app ./cmd/quipu-app
          /tmp/quipu-app -version
