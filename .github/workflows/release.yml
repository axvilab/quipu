name: Release

# Builds quipu and its window (quipu-app) natively for each platform on a version tag and publishes
# a GitHub release with checksums. DuckDB needs CGO, so there is no cross-compiling except darwin/amd64, which Apple's
# clang builds on an arm64 runner. See ADR 0005.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-22.04 }
          - { goos: linux, goarch: arm64, runner: ubuntu-22.04-arm }
          - { goos: darwin, goarch: arm64, runner: macos-14 }
          - { goos: darwin, goarch: amd64, runner: macos-14, cc: "clang -arch x86_64" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web interface
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: GTK and WebKit headers for the window
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Test
        if: ${{ !matrix.cc }}
        run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc || 'cc' }}
          VERSION: ${{ github.ref_name }}
        run: |
          ldflags="-s -w -X main.version=$VERSION"
          go build -trimpath -ldflags "$ldflags" -o quipu ./cmd/quipu
          # The native window (ADR 0007): next to quipu on Linux, as Quipu.app on macOS.
          if [ "$GOOS" = linux ]; then
            go build -trimpath -tags desktop,production,webkit2_41 -ldflags "$ldflags" -o quipu-app ./cmd/quipu-app
            tar czf "quipu_${GOOS}_${GOARCH}.tar.gz" quipu quipu-app LICENSE README.md
          else
            app=Quipu.app/Contents
            mkdir -p "$app/MacOS" "$app/Resources"
            # Wails uses UTType; `wails build` links its framework, plain go build must too.
            CGO_LDFLAGS="-framework UniformTypeIdentifiers" \
              go build -trimpath -tags desktop,production -ldflags "$ldflags" -o "$app/MacOS/quipu-app" ./cmd/quipu-app
            sed "s/VERSION/${VERSION#v}/" build/Info.plist > "$app/Info.plist"
            mkdir quipu.iconset
            for s in 16 32 128 256 512; do
              sips -z $s $s cmd/quipu-app/icon.png --out quipu.iconset/icon_${s}x${s}.png >/dev/null
              sips -z $((s * 2)) $((s * 2)) cmd/quipu-app/icon.png --out quipu.iconset/icon_${s}x${s}@2x.png >/dev/null
            done
            iconutil -c icns quipu.iconset -o "$app/Resources/quipu.icns"
            codesign --force --deep --sign - Quipu.app # ad-hoc: Apple Silicon runs only signed code
            tar czf "quipu_${GOOS}_${GOARCH}.tar.gz" quipu Quipu.app LICENSE README.md
          fi
      - name: Check the binaries run
        if: ${{ !matrix.cc }}
        run: |
          ./quipu version
          if [ -f quipu-app ]; then ./quipu-app -version; else Quipu.app/Contents/MacOS/quipu-app -version; fi
      - uses: actions/upload-artifact@v7
        with:
          name: quipu_${{ matrix.goos }}_${{ matrix.goarch }}
          path: quipu_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum quipu_*.tar.gz > checksums.txt && cat checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes $prerelease \
            quipu_*.tar.gz checksums.txt
